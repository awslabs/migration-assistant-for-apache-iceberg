[project]
name = "ima-app-server"
version = "0.1.1"
description = "Migration Assistant portal backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.0",
    "boto3>=1.42.83",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pyotp>=2.9.0",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
