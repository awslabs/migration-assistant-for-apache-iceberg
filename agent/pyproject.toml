
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ima-agent"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "aws-opentelemetry-distro >= 0.10.0",
    "bedrock-agentcore >= 1.0.3",
    "boto3 >= 1.38.0",
    "botocore >= 1.38.0",
    "fastavro >= 1.9.0",
    "strands-agents >= 1.13.0",
]