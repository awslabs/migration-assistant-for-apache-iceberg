# Docs site: build on pull requests, deploy to GitHub Pages on release.
#
# - pull_request: build only, so broken links and anchors fail the PR.
# - release published: build the release tag and deploy it, so the live site
#   always matches the latest release.
# - workflow_dispatch: redeploy the docs of an existing vX.Y.Z tag.
#
# One-time setup: Settings > Pages > Source: GitHub Actions, and allow tags
# `v*` in the github-pages environment's deployment rules.
name: Docs
on:
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (for example v0.1.1)
        required: true
        type: string
# Least privilege: read-only by default; only the deploy job can write Pages.
permissions:
  contents: read
# One deploy at a time; a newer PR push supersedes an older build.
concurrency:
  group: docs-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Hide Material for MkDocs' MkDocs 2.0 notice so it doesn't clutter the logs.
  NO_MKDOCS_2_WARNING: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the requested tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like vX.Y.Z, got '$TAG'."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Release events already check out the release tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build the site
        # --strict turns warnings (broken links, missing anchors) into errors.
        run: mkdocs build --strict
      - name: Upload the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
